{% extends "base.html" %}

{% block title %}Home - The Music Shop{% endblock %}

{% block content %}
    <body>
        <h2>Welcome to Music Shop!</h2>
        <p>Columns</p>

        <form action="{{ url_for('visit') }}" method="post">
            
            <select name="item_selector" id="item_selector">
                {% for model_name, acc in models.items() %}
                    <option style="font-size: 18px;" value="{{ acc['model'] }}">
                        {{ model_name }} - ${{ '%.2f' % acc["price"] }} <b>({{ acc["stock"] }})</b>
                    </option>
                {% endfor %}
            </select>

            <button type="submit">     Visit     </button>
        </form>

        {% if panel_params %}
            <p>{{ panel_params['cart'] }}</p>
            <div id="panel-frame">
                <h3>Item Added</h3>
                <hr>
                <ul class="mini-list-container">

                    <!-- list per item -->
                    <li class="mini-list-item">

                        <!-- I: Image and Quantity -->
                        <div class="img-qty-placer">
                            <img class="img-item">
                            <span class="counter">2</span>
                        </div>

                        <!-- II: Name, Author, and Price -->
                        <div class="txt-const">
                            <div class="name-author">
                                <span class="emphasise">Amazing</span>
                                <p>Author</p>
                            </div>
                            <!-- Price -->
                            <p class="price">$19.00</p>
                        </div>

                    </li>
                </ul>
                <div class="btn-stack-inline">
                    <button type="button" id="btn-continued">Continue Shopping</button>
                    <button type="button" class="outlined">View My Cart</button>
                </div>
            </div>
            <div class="black-overlay"></div>

            <script>
                function closure() {
                    panel.classList.remove("appear");
                    
                    // After the transform effect, trigger in 500 ms delay
                    setTimeout(() => {
                        panel.remove();
                        blackOverlay.remove();
                    }, 500);
                }

                const panel = document.getElementById("panel-frame");
                const blackOverlay = document.querySelector(".black-overlay")

                // prevents automatic appear
                setTimeout(() => {
                    panel.classList.add("appear");
                }, 3);

                document.getElementById("btn-continued").addEventListener("click", closure);
                blackOverlay.addEventListener("click", closure);
            </script>
        {% endif %}


    </body>
{% endblock %}
