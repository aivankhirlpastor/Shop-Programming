{% extends "base.html" %}

{% block title %}Checkout - The Music Shop{% endblock %}

{% block content %}
    <body>
        <h2>Checkout</h2>
        <section class="grid grid-display checkout">

            <div class="info-reiteration"></div>
            <form action="" method="post" class="checkout-form grid">
                <div class="form-block fr-first-name">
                    <label for="first-name">First Name</label>
                    <input type="text" name="first-name" id="first-name" required>
                </div>
                <div class="form-block fr-surname">
                    <label for="surname">Last Name</label>
                    <input type="text" name="surname" id="surname" required>
                </div>
                <div class="form-block fr-email">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email" required>
                </div>
                <div class="form-block fr-physical-addr">
                    <label for="physical-addr">Physical Address</label>
                    <input type="text" name="physical-addr" id="physical-addr" required>
                </div>
                <div class="form-block fr-suburb">
                    <label for="suburb">Town/Suburb</label>
                    <input type="text" name="suburb" id="suburb" required>
                </div>
                <div class="form-block fr-postal-code">
                    <label for="postal-code">Postal Code</label>
                    <input type="text" name="postal-code" id="postal-code" required>
                </div>
            </form>

            <div class="panel-details"></div>
        </section>

    </body>
{% endblock %}
