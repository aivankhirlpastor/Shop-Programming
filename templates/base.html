<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Music Shop{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>The Music Shop</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a>About</a></li>
                <li><a>Shop</a></li>
                <li><a>5</a></li>
            </ul>
        </nav>
        <a href="{{ url_for('cart') }}">My Cart</a>
    </header>
    <main class="grid-layout">{% block content %}{% endblock %}</main>
    <footer>@ 2026 The Music Shop.</footer>
</body>
</html>
